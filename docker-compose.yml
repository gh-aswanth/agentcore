services:
  db:
    # pgvector/pgvector, NOT postgres:16 — plain Postgres has no `vector` extension
    # and the first migration dies on CREATE EXTENSION.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentcore
    ports: ["5432:5432"]
    # Bind mount rather than a named volume: the data sits in ./.data/postgres
    # where you can see it, and — unlike a named volume — it survives
    # `docker compose down -v`. Gitignored.
    volumes: ["./.data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      # Postgres binds the port before it accepts connections; without this the
      # api container's `alembic upgrade head` races the first boot and fails.
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentcore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Default redis keeps everything in memory only, so a restart loses the
    # short-term memory windows and every run's event stream. AOF makes them
    # survive; the stream TTLs still apply.
    command: redis-server --appendonly yes --appendfsync everysec
    ports: ["6379:6379"]
    volumes: ["./.data/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    # Migrations run here so a fresh clone needs no manual step.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --loop uvloop"
    # host port is overridable (API_PORT) for machines that already use 8000
    ports: ["${API_PORT:-8000}:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/agentcore
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: .
      target: runtime
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      # Overrides the image's HTTP check, which belongs to the api — a Celery
      # worker serves no HTTP. This asks the worker itself over the broker.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/agentcore
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      # service_healthy, not service_started: the api container runs the
      # migrations, and the worker must not open a session before they land.
      api: {condition: service_healthy}

  # Offline test suite. Under a profile, so `docker compose up` ignores it:
  #   docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      OPENAI_API_KEY: test-key
